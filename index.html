<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet ISTC</title>
<meta name="description" content="Fiches et entraînement ISTC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout : DA « Kaki moderne ». Sable et kaki profond, formes arrondies, une colonne de 860px max avec onglets collés en haut. */
:root{color-scheme:light;
  --bg:#E9E4D8; --surface:#F6F2E9; --sunk:#DFD8C7; --ink:#2C3320; --muted:#6E6A5A; --line:#D3CBB8;
  --olive:#4F5D2F; --olive-soft:#DCE0C6; --accent:#A0522D; --accent-ink:#FFFFFF;
  --good:#2E7D4F; --good-bg:#D8EAD6; --bad:#A63A2B; --bad-bg:#F1DAD3;
  --f-display:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-mono:"Manrope","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161912; --surface:#1F2419; --sunk:#2A3022; --ink:#E9E4D8; --muted:#A6A18F; --line:#353C2B;
  --olive:#AEBF82; --olive-soft:#2E3723; --accent:#E39A6B; --accent-ink:#1A0F08;
  --good:#7FCB93; --good-bg:#1E3326; --bad:#F0907D; --bad-bg:#3B2420; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#161912; --surface:#1F2419; --sunk:#2A3022; --ink:#E9E4D8; --muted:#A6A18F; --line:#353C2B;
  --olive:#AEBF82; --olive-soft:#2E3723; --accent:#E39A6B; --accent-ink:#1A0F08;
  --good:#7FCB93; --good-bg:#1E3326; --bad:#F0907D; --bad-bg:#3B2420; color-scheme:dark }

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto}
.mono{font-family:var(--f-mono)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;line-height:1.15;text-wrap:balance;margin:0}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Bandeau */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.top-in{max-width:860px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:26px;font-weight:800}
.brand h1 span{color:var(--olive)}
.who{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:8px 12px 10px;font-family:var(--f-body);font-weight:700;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--olive)}
.tab:hover{color:var(--ink)}

[hidden]{display:none!important}
.ctrlchip{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--olive);background:var(--olive-soft);border-radius:999px;padding:3px 9px}
.ta{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;border-radius:12px;font:inherit;resize:vertical}
.fb.self{background:var(--sunk)}
.model{white-space:pre-wrap;font-weight:500}
.cible{max-width:260px;width:100%;height:auto;display:block;margin:2px auto}
.cible .grid line{stroke:var(--line);stroke-width:1}
.cible .tri{fill:var(--ink)} .cible .ring{fill:none;stroke:var(--ink);stroke-width:3}
.cible .imp{fill:var(--bad)} .cible .grp{fill:none;stroke:var(--bad);stroke-width:1.5;stroke-dasharray:3 3}
.cibleimg{width:100%;max-width:420px;height:auto;display:block;margin:6px auto;border-radius:10px;border:1px solid var(--line)}
.exq{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-top:1px solid var(--line)}
.exq:first-of-type{border-top:0}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.exh p{margin:0;font-weight:700;font-size:17px;line-height:1.35}
.pts{font-size:13px;font-weight:700;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.pts.got{color:var(--olive)}
.ex input,.gridq input{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 10px;border-radius:12px;min-height:44px;font:inherit}
.gridq{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px}
.gridq.wide{grid-template-columns:1fr}
.gridq label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
.gridq .ok input{border-color:var(--good);background:var(--good-bg)} .gridq .ko input{border-color:var(--bad);background:var(--bad-bg)}
.gridq .exp{font-size:12px;color:var(--good);font-weight:600}
.corr{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.total{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.03em}
.total small{font-size:26px;color:var(--muted)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
img{max-width:100%}
main{display:flex;flex-direction:column;gap:20px;padding-top:22px}
.card{background:var(--surface);border:0;border-radius:18px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:14px;color:var(--muted);margin:0}
.banner{font-size:14px;padding:10px 12px;border-radius:12px;background:var(--olive-soft);color:var(--ink);margin:0}

/* Boutons */
.btn{appearance:none;border:0;background:var(--sunk);color:var(--ink);padding:10px 18px;border-radius:12px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.chip{appearance:none;border:0;background:var(--sunk);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;min-height:38px}
.chip[aria-pressed="true"]{background:var(--olive);color:var(--surface)}
.chip[aria-pressed="true"] .bar{background:color-mix(in srgb,var(--surface) 35%,transparent)} .chip[aria-pressed="true"] .bar i{background:var(--surface)}

/* Accueil entraînement */
.setup h2{font-size:26px}
.field{display:flex;flex-direction:column;gap:8px}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.th{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.th h3{font-size:20px}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--olive)}
.th .nums{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.weak{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.weak li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.weak li:first-child{border-top:0}
.weak .ko{font-family:var(--f-mono);color:var(--bad);white-space:nowrap}

/* Question */
.q-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--olive);border-radius:3px;transition:width .3s}
.prompt{font-size:21px;font-weight:800;line-height:1.35;margin:0;text-wrap:pretty;letter-spacing:-.01em}
.choices{display:grid;gap:8px}
.choice{appearance:none;text-align:left;border:1.5px solid transparent;background:var(--bg);color:var(--ink);padding:12px 14px;border-radius:12px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;min-height:50px;font-weight:600}
.choice:hover:not(:disabled){border-color:var(--olive)}
.choice .k{font-size:12px;font-weight:800;color:var(--muted);background:var(--surface);border-radius:6px;padding:1px 7px;flex:none;margin-top:2px}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice:disabled{cursor:default}
.answer{display:flex;gap:8px;flex-wrap:wrap}
.answer input{flex:1 1 220px;min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;border-radius:12px;min-height:46px}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--good-bg)}
.fb.ko{background:var(--bad-bg)}
.fb strong{font-family:var(--f-display);font-weight:800;font-size:18px}
.fb.ok strong{color:var(--good)} .fb.ko strong{color:var(--bad)}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--olive);text-decoration:underline;cursor:pointer;font-size:14px;align-self:flex-start}
.score{font-family:var(--f-display);font-weight:800;font-size:72px;line-height:1;letter-spacing:-.03em}
.score small{font-size:32px;color:var(--muted)}
.misses{list-style:none;margin:0;padding:0}
.misses li{border-top:1px solid var(--line);padding:10px 0;font-size:15px;display:flex;flex-direction:column;gap:2px}
.misses .a{color:var(--good);font-weight:600}

/* Fiches */
.fnav{display:flex;gap:6px;flex-wrap:wrap}
.matiere{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px;align-items:start}
.block{background:var(--surface);border:0;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;scroll-margin-top:140px}
.block.flash{outline:3px solid var(--accent)}
.block.wide{grid-column:1/-1}
.block-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.block-h h3{font-size:20px}
.sig{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:13px;background:var(--olive);color:var(--surface);padding:2px 8px;border-radius:8px;white-space:nowrap}
.phon{font-size:12px;color:var(--muted);margin:0}
.acro{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.acro li{display:flex;gap:10px;align-items:baseline}
.acro .L{font-family:var(--f-display);font-weight:800;font-size:22px;width:28px;text-align:center;color:var(--accent);flex:none;line-height:1}
.plain{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.refl li{display:list-item}.refl li>span:first-child{margin-right:8px}.rn{display:inline-flex;gap:4px;vertical-align:1px}.rn b{font-size:12px;font-weight:800;color:var(--surface);background:var(--accent);border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;font-variant-numeric:tabular-nums}
.lines{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.lines li{padding-left:14px;border-left:3px solid var(--olive-soft)}
.pyr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.pyr li{background:var(--olive-soft);text-align:center;padding:6px 8px;border-radius:8px;font-weight:600;font-size:15px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.term{font-weight:600;white-space:nowrap}
.nato{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.nato div{background:var(--bg);border-radius:10px;padding:6px 8px;display:flex;gap:8px;align-items:baseline}
.nato b{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent);width:16px}
.fmd{max-width:300px;width:100%;height:auto;display:block;margin:4px auto}
.fmd .s{stroke:var(--ink)} .fmd .f{fill:var(--olive-soft)} .fmd .t{fill:var(--ink)} .fmd .m{fill:var(--muted)} .fmd .x{stroke:var(--accent)}

.fig{max-width:340px;width:100%;height:auto;display:block;margin:4px auto}
.fig .s{stroke:var(--ink)} .fig .x{stroke:var(--accent)} .fig .t2{stroke:var(--olive)} .fig .t{fill:var(--ink)} .fig .m{fill:var(--muted)} .fig .xt{fill:var(--accent)}
.fig .a1{stroke:var(--olive)} .fig .a1f,.fig .a1t{fill:var(--olive)} .fig .a2{stroke:var(--accent)} .fig .a2f,.fig .a2t{fill:var(--accent)} .fig .a3{stroke:var(--muted)} .fig .a3f,.fig .a3t{fill:var(--muted)} .fig .dotc{fill:var(--ink)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .y{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.tree{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.tg{border:2px solid var(--ink);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tg0{border-color:var(--bad)} .tg1{border-color:var(--olive)}
.tgh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tgh b{font-family:var(--f-display);font-weight:800;font-size:20px}
.tg0 .tgh b{color:var(--bad)} .tg1 .tgh b{color:var(--olive)}
.tgh span{font-size:12px;color:var(--muted)}
.kids{display:flex;flex-direction:column;gap:6px}
.branch{border-left:3px solid var(--line);padding-left:10px;display:flex;flex-direction:column;gap:6px}
.bh{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.leaf{background:var(--sunk);border-radius:4px;padding:7px 10px;display:flex;flex-direction:column;gap:1px}
.leaf b{font-weight:600}
.leaf span{font-size:14px;color:var(--muted)}
/* Classement */
.board td,.board th{font-variant-numeric:tabular-nums}
.board td.n{font-family:var(--f-mono)}
.board tr.me td{background:var(--olive-soft)}
.board .rank{font-family:var(--f-display);font-weight:900;font-size:20px;width:36px}
.callsign{display:flex;gap:8px;flex-wrap:wrap}
.callsign input{flex:1 1 200px;min-width:0;border:2px solid var(--ink);background:var(--surface);padding:8px 10px;border-radius:4px;min-height:44px;font-family:var(--f-mono);text-transform:uppercase}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.tab{font-size:15px;padding:8px 7px 10px}.tabs{gap:0}.brand h1{font-size:28px}.prompt{font-size:19px}.score{font-size:60px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Carnet <span>ISTC</span></h1>
      <div class="who" id="who"><span class="dot" id="whoDot"></span><span id="whoTxt">Chargement…</span></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-entrainement" data-view="entrainement" aria-selected="true">Quiz</button>
      <button class="tab" role="tab" id="tab-fiches" data-view="fiches" aria-selected="false">Fiches</button>
      <button class="tab" role="tab" id="tab-controles" data-view="controles" aria-selected="false">Contrôles</button>
      <button class="tab" role="tab" id="tab-resultats" data-view="resultats" aria-selected="false">Résultats</button>
    </nav>
  </div>
</header>

<div class="wrap">
<main>
  <section id="v-entrainement" aria-labelledby="tab-entrainement"></section>
  <section id="v-fiches" aria-labelledby="tab-fiches" hidden></section>
  <section id="v-controles" aria-labelledby="tab-controles" hidden></section>
  <section id="v-resultats" aria-labelledby="tab-resultats" hidden></section>
</main>
</div>

<script>
/*ENGINE-START*/
const NATO={A:"Alpha",B:"Bravo",C:"Charlie",D:"Delta",E:"Echo",F:"Foxtrot",G:"Golf",H:"Hotel",I:"India",J:"Juliett",K:"Kilo",L:"Lima",M:"Mike",N:"November",O:"Oscar",P:"Papa",Q:"Quebec",R:"Romeo",S:"Sierra",T:"Tango",U:"Uniform",V:"Victor",W:"Whiskey",X:"X-ray",Y:"Yankee",Z:"Zulu"};
const NATO_ALTS={A:["Alfa"],J:["Juliet"],X:["Xray","X ray"],W:["Whisky"],Z:["Zoulou"]};

/* ===== Contenu des cours. Chaque thème = une fiche. ===== */
const CONTENT=[
{id:"armement",matiere:"Militaire · ISTC",name:"Armement et trinôme",blocks:[
  {id:"regles",type:"list",title:"Les 4 règles de sécurité",ordered:true,
   items:["Une arme doit toujours être considérée comme chargée","Ne jamais pointer ou laisser pointer le canon d'une arme sur quelque chose que l'on ne veut pas détruire","Garder l'index hors de la détente tant que les organes de visée ne sont pas sur l'objectif","Être sûr de son objectif et de son environnement"],
   countQ:"Combien y a-t-il de règles de sécurité sur l'armement ?",posQ:"Quelle est la règle de sécurité n°{n} ?",noPool:true,ctrl:"AIT",
   more:[{id:"mpm",self:true,q:"Donne mot pour mot les 4 règles de sécurité ISTC.",a:"1. Une arme doit toujours être considérée comme chargée. 2. Ne jamais pointer ou laisser pointer le canon d'une arme sur quelque chose que l'on ne veut pas détruire. 3. Garder l'index hors de la détente tant que les organes de visée ne sont pas sur l'objectif. 4. Être sûr de son objectif et de son environnement."}]},
  {id:"patracdr",type:"acro",sigle:"PATRACDR",title:"Préparation du matériel",letters:[["P","Personnel"],["A","Armement"],["T","Tenue"],["R","Radio"],["A","Alimentation"],["C","Camouflage"],["D","Divers"],["R","Rassemblement"]]},
  {id:"actes",type:"acro",ctrl:"CBT",sigle:"PPGARDCOCOME",title:"Les 12 actes réflexes du combattant",countQ:"Combien y a-t-il d'actes réflexes ?",alts:{2:["Garder la liaison"],8:["Camoufler"]},
   letters:[["P","Progresser"],["P","Se protéger"],["G","Garder la liaison au sein du trinôme"],["A","Apprécier une distance"],["R","Rendre compte"],["D","Désigner un objectif"],["C","Communiquer"],["O","Observer"],["C","Se camoufler"],["O","S'orienter"],["M","Mettre en œuvre son armement"],["E","S'équiper"]]},
  {id:"ddro",type:"acro",ctrl:"CBT",sigle:"DDRO",title:"Désigner un objectif",letters:[["D","Direction"],["D","Distance"],["R","Repère"],["O","Objectif"]]},
  {id:"crendu",type:"facts",title:"Rendre compte",lines:["Je suis, je vois, je fais, je demande."],
   qs:[{id:"ordre",q:"Rendre compte se fait en 4 temps. Lesquels ?",a:"Je suis, je vois, je fais, je demande",wrong:["Je vois, je suis, je fais, je demande","Je suis, je vois, je pense, je demande","Je suis, j'observe, j'agis, je rends compte"],qcmOnly:true},

/* ===== Outils ===== */
function rand(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a){return a[rand(a.length)]}
const STOP=new Set(["le","la","les","l","un","une","des","de","d","du","se","s","son","sa","ses","en","a","au","aux"]);
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/œ/g,"oe").replace(/×/g," fois ").replace(/÷/g," divise ").replace(/\+/g," plus ").replace(/[’']/g," ").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w&&!STOP.has(w)).join(" ")}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function textMatch(input,answers){const x=norm(input);if(!x)return false;const xs=x.replace(/ /g,"");
  for(const a of answers){const y=norm(a);if(!y)continue;const ys=y.replace(/ /g,"");if(xs===ys)return true;
    const tol=ys.length<=3?0:ys.length<=7?1:ys.length<=14?2:3;if(lev(xs,ys)<=tol)return true}return false}
function numMatch(input,ans,tol,accept){const s=String(input).replace(",",".").replace(/[^0-9.\-]/g,"");if(!s)return false;const v=parseFloat(s);if(isNaN(v))return false;const t=tol!=null?tol:Math.max(Math.abs(ans)*0.02,0.05);if((accept||[]).some(x=>Math.abs(v-x)<=t))return true;return Math.abs(v-ans)<=t}
function sigleMatch(input,sig){return String(input).toUpperCase().replace(/[^A-Z0-9]/g,"")===sig.toUpperCase()}
function splitPieces(input){return String(input).split(/[,;\n·\/]+|\s-\s/).map(s=>s.trim()).filter(Boolean)}
function multiMatch(input,expected){ /* expected: [[answer, ...alts], ...] ; renvoie {ok, missing} */
  const pieces=splitPieces(input);const used=new Set();const missing=[];
  for(const alts of expected){let found=-1;for(let i=0;i<pieces.length;i++){if(used.has(i))continue;if(textMatch(pieces[i],alts)){found=i;break}}
    if(found<0)missing.push(alts[0]);else used.add(found)}
  return {ok:missing.length===0,missing}}
function fmt(n){const r=Math.round(n*100)/100;return Math.abs(r)>=10000?r.toLocaleString("fr-FR"):r.toString().replace(".",",")}
function firstLetter(w){const x=String(w).replace(/^(se |s'|le |la |les |l'|en |un |une )/i,"").normalize("NFD").replace(/[̀-ͯ]/g,"");return (x[0]||"").toUpperCase()}
function uniqByNorm(arr,exclude=[]){const seen=new Set(exclude.map(norm));const out=[];for(const a of arr){const k=norm(a);if(!k||seen.has(k))continue;seen.add(k);out.push(a)}return out}
function ord(i){return i===0?"1re":(i+1)+"e"}

/* ===== Fabriques de questions ===== */
function QCM(prompt,correct,distractors,extra){const flat=Array.isArray(distractors[0])?distractors.flatMap(t=>shuffle(t)):shuffle(distractors);const d=uniqByNorm(flat,[correct]).slice(0,3);
  return Object.assign({kind:"qcm",prompt,correct,choices:shuffle([correct,...d]),answerText:correct},extra||{})}
function TYPED(prompt,answers,extra){return Object.assign({kind:"typed",prompt,answers,answerText:answers[0],check:v=>textMatch(v,answers)},extra||{})}
function SIGLE(prompt,sig,extra){return Object.assign({kind:"typed",prompt,answers:[sig],answerText:sig,placeholder:"Sigle",check:v=>sigleMatch(v,sig)},extra||{})}
function NUM(prompt,value,unit,extra){const e=extra||{};return Object.assign({kind:"num",prompt,answerText:fmt(value)+(unit?" "+unit:""),unit:unit||"",check:v=>numMatch(v,value,e.tol,e.accept)},e)}
function MULTI(prompt,expected,extra){return Object.assign({kind:"multi",prompt,expected,answerText:expected.map(e=>e[0]).join(", "),placeholder:"Sépare par des virgules",check:v=>multiMatch(v,expected).ok,missing:v=>multiMatch(v,expected).missing},extra||{})}
function SELF(prompt,model,extra){return Object.assign({kind:"self",prompt,answerText:model},extra||{})}
function either(qcmFn,typedFn,pQcm){return Math.random()<(pQcm==null?0.55:pQcm)?qcmFn():typedFn()}

function themeWords(th){const w=[];for(const b of th.blocks){if(b.type==="acro")b.letters.forEach(x=>w.push(x[1]));if(b.type==="list"&&!b.noPool)w.push(...b.items)}return uniqByNorm(w)}
function notIn(pool,items){const ns=items.map(norm);return pool.filter(p=>{const k=norm(p);return k&&!ns.some(n=>n===k||n.includes(k)||k.includes(n))})}

function buildBank(){
  const bank=[];
  const allSigles=[];CONTENT.forEach(t=>t.blocks.forEach(b=>{if(b.type==="acro")allSigles.push(b.sigle)}));
  for(const th of CONTENT){
    const pool=themeWords(th);
    const sigles=th.blocks.filter(b=>b.type==="acro").map(b=>b.sigle);
    const byId=Object.fromEntries(th.blocks.map(b=>[b.id,b]));
    for(const b of th.blocks){
      const add=(sub,make,ctrl)=>bank.push({id:th.id+"."+b.id+"."+sub,theme:th.id,block:b.id,blockTitle:b.title,ctrl:ctrl||b.ctrl||null,make});
      const factQs=(qs)=>qs.forEach(f=>add("f-"+f.id,()=>{
        if(f.self)return SELF(f.q,f.a);
        if(typeof f.a==="number")return NUM(f.q,f.a,f.unit,{tol:f.tol!=null?f.tol:(Number.isInteger(f.a)?0:undefined),accept:f.accept});
        const answers=[f.a,...(f.alts||[])];
        if(f.wrong&&f.qcmOnly)return QCM(f.q,f.a,f.wrong);
        if(f.wrong){const t=/^[A-Z0-9]{2,6}$/.test(f.a)?()=>SIGLE(f.q,f.a):()=>TYPED(f.q,answers);return either(()=>QCM(f.q,f.a,f.wrong),t)}
        return TYPED(f.q,answers)},f.ctrl));

      if(b.type==="acro"){
        const words=b.letters.map(x=>x[1]);const altsOf=i=>[words[i],...((b.alts&&b.alts[i])||[])];
        b.letters.forEach(([L,w],i)=>add("l"+i,()=>{
          const p=`Dans ${b.sigle} (${b.title.toLowerCase()}), que veut dire la ${ord(i)} lettre, « ${L} » ?`;
          const bad=altsOf(i).map(norm);const okd=x=>{const k=norm(x);return !bad.some(a=>a===k||a.includes(k)||k.includes(a))};const dis=[pool.filter(x=>firstLetter(x)===L).filter(okd),words.filter(okd),pool.filter(okd)];
          return either(()=>QCM(p,w,dis),()=>TYPED(p,altsOf(i)),0.5)}));
        add("sigle",()=>{const p=`Quel est le sigle pour « ${b.title} » ?`;
          const others=shuffle(sigles.filter(s=>s!==b.sigle));if(others.length<3)others.push(...shuffle(allSigles.filter(s=>s!==b.sigle&&!others.includes(s))));const close=others.filter(s=>Math.abs(s.length-b.sigle.length)<=1);
          return either(()=>QCM(p,b.sigle,[close,others]),()=>SIGLE(p,b.sigle),0.45)});
        add("mots",()=>{const correct=words.join(" · ");const dis=[];
          for(let k=0;k<6&&dis.length<3;k++){const w2=words.slice();const i=rand(w2.length);const L=b.letters[i][0];
            const cand=notIn(shuffle(pool.filter(x=>firstLetter(x)===L)),words);const alt=cand[0]||notIn(shuffle(pool),words)[0];if(!alt)continue;w2[i]=alt;const s=w2.join(" · ");if(s!==correct&&!dis.includes(s))dis.push(s)}
          if(b.letters.length<=8&&Math.random()<0.4)return MULTI(`Donne tous les mots de ${b.sigle} (${b.title.toLowerCase()}).`,b.letters.map((_,i)=>altsOf(i)));
          return QCM(`Que veut dire ${b.sigle} en entier ?`,correct,dis)});
        const intruders=notIn(pool,words);
        if(intruders.length>=3)add("intrus",()=>{const keep=shuffle(words).slice(0,3);const intr=pick(intruders);
          return {kind:"qcm",prompt:`Lequel de ces mots ne fait pas partie de ${b.sigle} ?`,correct:intr,choices:shuffle([intr,...keep]),answerText:intr}});
        if(b.countQ)add("count",()=>NUM(b.countQ,words.length));
      }

      if(b.type==="list"){
        const items=b.items;const altsOf=i=>[items[i],...((b.alts&&b.alts[i])||[])];
        let lp=b.pool?byId[b.pool].letters.map(x=>x[1]):pool;
        lp=notIn(uniqByNorm([...(b.extraPool||[]),...lp]),items);
        if(b.countQ)add("count",()=>NUM(b.countQ,items.length));
        const lpX=notIn(uniqByNorm(b.extraPool||[]),items);
        if(!b.noPool&&lp.length>=3){
          add("in",()=>{const c=pick(items);return QCM(`Lequel fait partie de « ${b.title} » ?`,c,[lpX,lp])});
          if(items.length>=3)add("out",()=>{const keep=shuffle(items).slice(0,3);const intr=pick(lpX.length&&Math.random()<0.7?lpX:lp);
            return {kind:"qcm",prompt:`Lequel ne fait pas partie de « ${b.title} » ?`,correct:intr,choices:shuffle([intr,...keep]),answerText:intr}});
        }
        if(b.ordered)items.forEach((it,i)=>add("p"+i,()=>{const p=(b.posQ||`${b.title}, quel est l'élément n°{n} ?`).replace("{n}",i+1);
          const dis=items.filter((_,k)=>k!==i);
          if(b.noPool)return QCM(p,it,dis);
          return either(()=>QCM(p,it,[dis,lp]),()=>TYPED(p,altsOf(i)),0.6)}));
        if(!b.noPool&&items.length<=7)add("all",()=>{
          if(items.length<=3&&Math.random()<0.5){const correct=items.join(" · ");const dis=[];
            for(let k=0;k<8&&dis.length<3;k++){const w2=items.slice();w2[rand(w2.length)]=pick(lp);const s=w2.join(" · ");if(s!==correct&&!dis.includes(s))dis.push(s)}
            return QCM(`Lesquels forment « ${b.title} » ?`,correct,dis)}
          return MULTI(`Cite les ${items.length} éléments de « ${b.title} ».`,items.map((_,i)=>altsOf(i)))});
      }

      if(b.type==="pairs"&&b.mode==="radio"){
        const terms=b.pairs.map(p=>p[0]),defs=b.pairs.map(p=>p[1]);
        b.pairs.forEach(([t,d],i)=>{
          add("d"+i,()=>QCM(`Que signifie « ${t} » ?`,d,defs.filter((_,k)=>k!==i)));
          add("t"+i,()=>{const p=`Quel terme radio veut dire « ${d} »`;
            return either(()=>QCM(p,t,terms.filter((_,k)=>k!==i)),()=>TYPED(p,[t,t.replace(/\s*\(.*\)/,"")]),0.6)});
        });
      }
      if(b.type==="pairs"&&b.mode==="alpha"){
        b.pairs.forEach(([L,w])=>add("a"+L,()=>TYPED(`Lettre « ${L} » en alphabet OTAN ?`,[w,...(NATO_ALTS[L]||[])],{placeholder:"Mot"})));
        add("epel",()=>{const s=pick(allSigles.filter(x=>x.length<=7));
          const exp=s.split("").map(L=>[NATO[L],...(NATO_ALTS[L]||[])]);
          return Object.assign({kind:"multi",prompt:`Épelle « ${s} » en alphabet OTAN.`,placeholder:"Ex : Delta, Delta…",answerText:exp.map(e=>e[0]).join(" "),
            check:v=>{const pc=String(v).split(/[\s,;·\/-]+/).filter(Boolean).filter(x=>!/^ray$/i.test(x));return pc.length===exp.length&&exp.every((alts,i)=>textMatch(pc[i],alts)||(alts[0]==="X-ray"&&/^x/i.test(pc[i])))},
            missing:()=>[]})});
      }
      if(b.type==="facts")factQs(b.qs);
      if(b.facts)factQs(b.facts);
      if(b.more)factQs(b.more);
      if(b.type==="pairs"&&b.mode==="def"){
        const terms=b.pairs.map(p=>p[0]),defs=b.pairs.map(p=>p[1]);
        b.pairs.forEach(([t,d],i)=>{
          if(b.pairs.length>=2)add("d"+i,()=>QCM(b.qDef.replace("{t}",t),d,defs.filter((_,k)=>k!==i)));
          if(defs.filter(x=>norm(x)===norm(d)).length>1)return;
          add("t"+i,()=>{const p=b.qTerm.replace("{d}",d);const others=terms.filter((_,k)=>k!==i);
            if(b.noTyped||others.length<1)return QCM(p,t,others);
            return either(()=>QCM(p,t,others),()=>TYPED(p,[t,...((b.alts&&b.alts[i])||[])]),0.6)});
        });
      }
      if(b.type==="timeline"){
        const ev=b.events.map(([y,l])=>[String(y).trim(),l]);const years=ev.map(e=>e[0]),labels=ev.map(e=>e[1]);
        ev.forEach(([y,l],i)=>{
          add("y"+i,()=>{if(/^\d{3,4}$/.test(y)&&Math.random()<0.6)return NUM(`En quelle année ? ${l}`,+y,"",{tol:0});
            return QCM(`Quand ? ${l}`,y,uniqByNorm(years.filter((x,k)=>k!==i&&x!==y)))});
          if(years.filter(x=>x===y).length===1)add("e"+i,()=>QCM(y==="Aujourd'hui"?"Qu'est-ce qui se passe aujourd'hui ?":`Que s'est-il passé en ${y} ?`,l,labels.filter((_,k)=>k!==i)));
        });
      }
      if(b.type==="tree"){
        const leaves=[];const walk=(n,top)=>{if(n.items)leaves.push({name:n.name,top,items:n.items});(n.children||[]).forEach(c=>walk(c,top))};
        b.groups.forEach(g=>walk(g,g.name));
        const leafNames=leaves.map(l=>l.name);
        leaves.forEach((lf,li)=>{
          lf.items.forEach((it,ii)=>{
            add("f"+li+"-"+ii,()=>Math.random()<0.7?QCM(`« ${it} », c'est un agent de quelle famille ?`,lf.name,[leaves.filter(o=>o.top===lf.top&&o!==lf).map(o=>o.name),leafNames])
              :({kind:"qcm",prompt:`« ${it} », c'est un agent…`,correct:lf.top,choices:b.groups.map(g=>g.name),answerText:lf.top}));
          });
          add("x"+li,()=>{const c=pick(lf.items);const others=leaves.filter(o=>o!==lf).flatMap(o=>o.items);return QCM(`Lequel est rangé dans « ${lf.name} » ?`,c,others)});
        });
      }
      if(b.reglage){
        add("c-reglage",()=>{const sg=()=>pick([-1,1]);const gx=sg()*pick([2,4,6]),gy=sg()*pick([2,4,6]);
          const H=gx<0?"Droite":"Gauche",V=gy>0?"Haut":"Bas",ch=Math.abs(gx)*1.5,cv=Math.abs(gy)*1.5;
          const fmtC=(h,a,v,b)=>`${h} ${a}, ${v} ${b}`;const correct=fmtC(H,ch,V,cv);
          const oH=H==="Droite"?"Gauche":"Droite",oV=V==="Haut"?"Bas":"Haut";
          const dis=[fmtC(oH,ch,oV,cv),fmtC(H,Math.abs(gx),V,Math.abs(gy)),fmtC(H,cv,V,ch),fmtC(oH,Math.abs(gx),oV,Math.abs(gy)),fmtC(H,ch*2,V,cv*2)];
          const fig=cibleSVG(gx,gy);const pr=`Organe de visée mécanique HK (2 carrés = 3 clics). Ton groupement est à ${Math.abs(gx)} carrés ${gx<0?"à gauche":"à droite"} et ${Math.abs(gy)} carrés ${gy>0?"en dessous":"au-dessus"} du cercle noir. Quelle correction ?`;
          if(Math.random()<0.7)return QCM(pr,correct,dis,{fig});
          return Object.assign(TYPED(pr,[correct]),{fig,placeholder:"Ex : Droite 3, Haut 6",check:v=>{const x=norm(v);const m1=new RegExp("\\b"+norm(H)+" "+ch+"\\b"),m2=new RegExp("\\b"+norm(V)+" "+cv+"\\b");return m1.test(x)&&m2.test(x)}})});
      }
      if(b.type==="calc"){
        factQs(b.qs);
        add("c-echelle",()=>{const s=pick([25000,50000,100000]);const cpk=100000/s;const label="1/"+s.toLocaleString("fr-FR");
          if(Math.random()<0.5){const km=pick([0.5,1.5,2,2.5,3,4,5]);return NUM(`Carte au ${label}. ${fmt(km)} km sur le terrain = combien de cm sur la carte ?`,km*cpk,"cm")}
          const cm=pick([2,3,4,5,6,8,10]);return NUM(`Carte au ${label}. ${cm} cm sur la carte = combien de km sur le terrain ?`,cm/cpk,"km")});
        add("c-site",()=>{const zm=200+rand(60)*10;const D=pick([0.5,1,1.5,2,2.5,4]);const site=pick([10,15,20,25,30,40,50,60]);const dz=Math.round(site*D);
          return NUM(`Tu es à ${zm} m. L'objectif est à ${zm+dz} m, à ${fmt(D)} km. Quel est le site (en millièmes) ?`,dz/D,"millièmes")});
        add("c-pente",()=>{const d=pick([200,250,400,500,800,1000,1250,2000]);const pct=pick([2,4,5,8,10,12,15,20]);const dz=Math.round(d*pct/100);const zm=300+rand(50)*10;
          return NUM(`Tu es à ${zm} m. Un point à ${zm+dz} m se trouve à ${d} m de distance. Quelle est la pente (en %) ?`,dz/d*100,"%")});
        add("c-fmd",()=>{const M=pick([2,4,5,6,8,10,12,15,20]);const D=pick([0.5,1,1.5,2,2.5,3,4]);const F=M*D;const v=rand(3);
          if(v===0)return NUM(`Un objectif est vu sous ${M} millièmes à ${fmt(D)} km. Quel est son front (en m) ?`,F,"m");
          if(v===1)return NUM(`Un véhicule de ${fmt(F)} m de long est à ${fmt(D)} km. Sous combien de millièmes le vois-tu ?`,M,"millièmes");
          return NUM(`Un bâtiment de ${fmt(F)} m de front est vu sous ${M} millièmes. À quelle distance est-il (en km) ?`,D,"km")});
      }
    }
  }
  return bank;
}
function cibleSVG(gx,gy){const c=20,N=15,O=150;let g="";
  for(let i=0;i<=N;i++){g+=`<line x1="${i*c}" y1="0" x2="${i*c}" y2="${N*c}"/><line x1="0" y1="${i*c}" x2="${N*c}" y2="${i*c}"/>`}
  const gxp=O+gx*c,gyp=O+gy*c;const imp=[[-8,-6],[7,-3],[-2,8]].map(([a,b])=>`<circle cx="${gxp+a}" cy="${gyp+b}" r="5" class="imp"/>`).join("");
  return `<svg class="cible" viewBox="0 0 300 300" role="img" aria-label="Cible de réglage avec le groupement"><g class="grid">${g}</g><polygon class="tri" points="${O-40},${O-62} ${O+40},${O-62} ${O},${O-14}"/><circle cx="${O}" cy="${O}" r="13" class="ring"/>${imp}<circle cx="${gxp}" cy="${gyp}" r="16" class="grp"/></svg>`}

const BANK=buildBank();

const LKEY="carnet-istc-stats-v1";
function freshStats(){return {q:{},total:0,correct:0,sessions:0,pseudo:"",updatedAt:0,ctrl:{}}}
function cleanStats(s){const f=freshStats();if(!s||typeof s!=="object")return f;return {q:(s.q&&typeof s.q==="object")?JSON.parse(JSON.stringify(s.q)):{},total:+s.total||0,correct:+s.correct||0,sessions:+s.sessions||0,pseudo:typeof s.pseudo==="string"?s.pseudo.slice(0,24):"",updatedAt:+s.updatedAt||0,ctrl:(s.ctrl&&typeof s.ctrl==="object")?JSON.parse(JSON.stringify(s.ctrl)):{}}}
function loadLocal(){try{const r=localStorage.getItem(LKEY);return r?cleanStats(JSON.parse(r)):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(stats))}catch(e){}}
let stats=loadLocal()||freshStats();
const R={status:"local"};

function rec(id,ok){const r=stats.q[id]||{ok:0,ko:0,st:0};if(ok){r.ok++;r.st=(r.st||0)+1}else{r.ko++;r.st=0}r.t=Date.now();stats.q[id]=r;stats.total++;if(ok)stats.correct++;stats.updatedAt=Date.now()}
function mastered(id){const r=stats.q[id];return !!r&&(r.st||0)>=2}
function isWeak(id){const r=stats.q[id];return !!r&&r.ko>0&&(r.st||0)<2}
function weight(id){const b=BYID[id]&&BYID[id].ctrl?1.4:1;return b*weight0(id)}
function weight0(id){const r=stats.q[id];if(!r)return 3;const st=r.st||0;if(st>=3)return 0.35;if(st>=2)return 0.8;return 2+Math.min(r.ko,5)*1.5}
function themeProgress(tid){const ids=BANK.filter(t=>t.theme===tid).map(t=>t.id);const m=ids.filter(mastered).length;const seen=ids.filter(i=>stats.q[i]).length;return {n:ids.length,m,seen,weak:ids.filter(isWeak).length}}
function masteryAll(){const m=BANK.filter(t=>mastered(t.id)).length;return {m,n:BANK.length}}
function weightedSample(ids,n){const arr=ids.map(id=>({id,w:weight(id)}));const out=[];while(out.length<n&&arr.length){const tot=arr.reduce((s,a)=>s+a.w,0);let r=Math.random()*tot;let k=0;for(;k<arr.length-1;k++){r-=arr[k].w;if(r<=0)break}out.push(arr[k].id);arr.splice(k,1)}return out}

  </div></div>`;
  el.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{const id=b.dataset.theme;if(setup.themes.has(id)){if(setup.themes.size>1)setup.themes.delete(id)}else setup.themes.add(id);renderTrain()});

    startSession(weightedSample(ids,setup.n))};
}
function statusBanner(){return ""}

function drillBlock(key){const [th,bl]=key.split(".");const ids=BANK.filter(t=>t.theme===th&&t.block===bl).map(t=>t.id);setView("entrainement",true);startSession(weightedSample(ids,Math.min(10,ids.length)))}
function startSession(ids){if(!ids.length)return;S={items:ids.map(id=>({id,q:BYID[id].make(),done:false})),i:0,done:false,score:0};renderTrain();window.scrollTo(0,0)}

function revealSelf(){const it=S.items[S.i];if(it.done)return;const q=it.q;const ta=$("#sans");ta.readOnly=true;document.querySelector("#sf button").hidden=true;

function answer(given,forced,selfMark){const it=S.items[S.i];if(it.done)return;const q=it.q;
  const ok=forced!=null?forced:q.kind==="qcm"?given===q.correct:q.check(given);it.done=true;it.ok=ok;it.given=given;if(ok)S.score++;
  rec(it.id,ok);queueSave();
  if(q.kind==="qcm"){document.querySelectorAll(".choice").forEach(b=>{const c=q.choices[+b.dataset.c];b.disabled=true;if(c===q.correct)b.classList.add("right");else if(c===given)b.classList.add("wrong")})}

function blockHTML(th,b){const head=(title,tag)=>`<div class="block-h"><h3>${esc(title)}</h3>${tag?`<span class="sig">${esc(tag)}</span>`:""}</div>`;
  let body="",wide=false;
  if(b.type==="acro")body=`<p class="phon">${b.sigle.split("").map(L=>NATO[L]).join(" ")}</p><ol class="acro">${b.letters.map(([L,w])=>`<li><span class="L">${L}</span><span>${esc(w)}</span></li>`).join("")}</ol>`;
  if(b.type==="list"){if(b.display==="pyramid"){const n=b.items.length;body=`<ol class="pyr">${b.items.map((x,i)=>`<li style="width:${40+i*(60/(n-1))}%">${esc(x)}</li>`).join("")}</ol><p class="note">Du sommet vers la base.</p>`}
    else if(b.pool){const ref=th.blocks.find(x=>x.id===b.pool);const words=ref.letters.map(l=>norm(l[1]));
      const numOf=x=>x.split(/ et /).map(p=>{const k=norm(p);let i=words.indexOf(k);if(i<0)i=words.findIndex(w=>w.includes(k)||k.includes(w));return i>=0?i+1:null}).filter(Boolean);
      body=`<p class="note">Le numéro = sa place dans les 12 actes réflexes (${esc(ref.sigle)}).</p><ol class="plain refl">${b.items.map(x=>`<li><span>${esc(x)}</span><span class="rn">${numOf(x).map(n=>`<b>${n}</b>`).join("")}</span></li>`).join("")}</ol>`}
    else body=`${b.ordered?"<ol":"<ul"} class="plain">${b.items.map(x=>`<li>${esc(x)}</li>`).join("")}${b.ordered?"</ol>":"</ul>"}`}
  if(b.type==="facts"||b.type==="calc")body=`<ul class="lines">${b.lines.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${b.type==="calc"?FMD_SVG:""}`;
  if(b.type==="pairs"&&(b.mode==="radio"||b.mode==="def")){wide=b.pairs.length>6;const c=b.cols||["Terme","Signification"];body=`<div class="tblw"><table><thead><tr><th>${esc(c[0])}</th><th>${esc(c[1])}</th></tr></thead><tbody>${b.pairs.map(([t,d])=>`<tr><td class="term">${esc(t)}</td><td>${esc(d)}</td></tr>`).join("")}</tbody></table></div>`}
  if(b.type==="timeline")body=`<ol class="tl">${b.events.map(([y,l])=>`<li><span class="y">${esc(String(y).trim())}</span><span>${esc(l)}</span></li>`).join("")}</ol>`;
  if(b.type==="tree"){wide=true;const node=n=>n.items?`<div class="leaf"><b>${esc(n.name)}</b><span>${n.items.map(esc).join(", ")}</span></div>`:`<div class="branch"><span class="bh">${esc(n.name)}</span><div class="kids">${n.children.map(node).join("")}</div></div>`;
    body=`<div class="tree">${b.groups.map((g,gi)=>`<div class="tg tg${gi}"><div class="tgh"><b>${esc(g.name)}</b>${g.sub?`<span>${esc(g.sub)}</span>`:""}</div><div class="kids">${g.children.map(node).join("")}</div></div>`).join("")}</div>`}
  if(b.type==="pairs"&&b.mode==="alpha"){wide=true;body=`<p class="note">À savoir par cœur.</p><div class="nato">${b.pairs.map(([L,w])=>`<div><b>${L}</b><span>${esc(w)}</span></div>`).join("")}</div>`}
  if(b.note&&b.type!=="tree")body=`<p class="note">${esc(b.note)}</p>`+body;
  if(b.note&&b.type==="tree")body+=`<p class="note">${esc(b.note)}</p>`;
  if(b.svgKey&&FIGS[b.svgKey])body+=FIGS[b.svgKey];
  const n=BANK.filter(t=>t.theme===th.id&&t.block===b.id).length;
  if(b.ctrl)body=`<span class="ctrlchip">Tombé au contrôle ${esc(b.ctrl)}</span>`+body;
  return `<article class="block${wide?" wide":""}" id="b-${th.id}-${b.id}">${head(b.title,b.type==="acro"?b.sigle:"")}${body}
    <div class="row" style="justify-content:space-between;margin-top:auto"><span class="lbl">${n} question${n>1?"s":""}</span><button class="btn small" data-drill="${th.id}.${b.id}">S'entraîner</button></div></article>`}
function renderFiches(){const el=$("#v-fiches");const th=THEMES[ficheTheme];
  el.innerHTML=`<div class="stack"><div class="fnav">${CONTENT.map(t=>`<button class="chip" aria-pressed="${t.id===ficheTheme}" data-ft="${t.id}">${esc(t.name)}</button>`).join("")}</div>
    <div class="stack" style="gap:4px"><span class="matiere">${esc(th.matiere)}</span><h2 style="font-size:36px">${esc(th.name)}</h2></div>
    <div class="blocks">${th.blocks.map(b=>blockHTML(th,b)).join("")}</div></div>`;
  el.querySelectorAll("[data-ft]").forEach(b=>b.onclick=()=>{ficheTheme=b.dataset.ft;renderFiches()});
  el.querySelectorAll("[data-drill]").forEach(b=>b.onclick=()=>drillBlock(b.dataset.drill));
}

function exportText(){const all=masteryAll();const lines=["Carnet ISTC, mes résultats","Maîtrise globale : "+all.m+" / "+all.n+" questions","Réponses : "+stats.correct+" bonnes sur "+stats.total+" ("+(stats.total?Math.round(stats.correct/stats.total*100):0)+" %), "+stats.sessions+" séries",""];
  CONTENT.forEach(t=>{const p=themeProgress(t.id);lines.push(t.name+" : "+p.m+"/"+p.n+" maîtrisées, "+p.seen+" vues, "+p.weak+" à revoir")});
  const weak=BANK.filter(t=>isWeak(t.id)).sort((a,b)=>stats.q[b.id].ko-stats.q[a.id].ko).slice(0,25);
  const cn=Object.entries(stats.ctrl||{});if(cn.length){lines.push("","Contrôles :");cn.forEach(([k,v])=>{const c=CONTROLES.find(x=>x.id===k);if(c)lines.push("- "+c.title+" : dernière note "+fmt(v.last)+"/"+ctrlTotal(c)+", meilleure "+fmt(v.best)+"/"+ctrlTotal(c))})}
  if(weak.length){lines.push("","Points faibles :");weak.forEach(t=>{const r=stats.q[t.id];lines.push("- "+THEMES[t.theme].name+" > "+t.blockTitle+" ["+t.id+"] "+r.ko+" erreur(s), "+r.ok+" réussite(s)")})}
  return lines.join("\n")}

  const r=$("#reset");if(r)r.onclick=()=>{confirmReset=true;renderResults()};

  const y=$("#resetYes");if(y)y.onclick=()=>{stats=freshStats();saveLocal();confirmReset=false;S=null;renderAll()};
}

function ctrlTotal(c){return c.items.reduce((a,i)=>a+i.pts,0)}
const half=x=>Math.round(x*2)/2;
function gradeItem(it,v){
  if(it.type==="self")return null;
  if(it.type==="list"){const pieces=splitPieces(v||"");const used=new Set();const idx=[];const missing=[];
    it.expect.forEach(alts=>{let f=-1;for(let i=0;i<pieces.length;i++){if(used.has(i))continue;if(textMatch(pieces[i],alts)){f=i;break}}if(f<0)missing.push(alts[0]);else{used.add(f);idx.push(f)}});
    let r=idx.length/it.expect.length,order=true;if(it.ordered){for(let i=1;i<idx.length;i++)if(idx[i]<idx[i-1])order=false;if(!order)r/=2}
    return {pts:half(it.pts*r),missing,order}}
  if(it.type==="text"){const x=String(v||"");let ok=textMatch(x,it.answers);if(!ok&&it.re){const t=it.re.map(r=>new RegExp(r,"i").test(norm(x)||x)||new RegExp(r,"i").test(x));ok=it.reAll?t.every(Boolean):t.some(Boolean)}return {pts:ok?it.pts:0}}
  if(it.type==="num")return {pts:numMatch(v||"",it.a,it.tol,it.accept)?it.pts:0};
  if(it.type==="grid"){const vals=v||[];const oks=it.rows.map((r,k)=>textMatch(vals[k]||"",r.alts));return {pts:half(it.pts*oks.filter(Boolean).length/it.rows.length),oks}}
}
let CT=null;
function renderCtrl(){const el=$("#v-controles");
  if(!CT){el.innerHTML=`<div class="stack"><div class="card stack"><h2 style="font-size:28px">Anciens contrôles</h2>
    <p class="note">Refais chaque épreuve comme le jour J, avec le barème. Les réponses à liste sont corrigées automatiquement. Pour les questions mot pour mot, tu compares avec le corrigé et tu te notes.</p></div>
    <div class="ctl">${CONTROLES.map(c=>{const r=(stats.ctrl||{})[c.id];const t=ctrlTotal(c);return `<div class="card stack" style="gap:10px"><div class="row" style="justify-content:space-between;align-items:baseline"><h2 style="font-size:26px">${esc(c.title)}</h2><span class="pts">${c.items.length} questions · /${t}</span></div>
      ${c.skipped?`<p class="note">${esc(c.skipped)}</p>`:""}
      <p class="note">${r?`Dernière note ${fmt(r.last)}/${t} · meilleure ${fmt(r.best)}/${t}`:"Pas encore fait."}</p>
      <div class="row"><button class="btn" data-start="${c.id}">Commencer</button></div></div>`}).join("")}</div></div>`;
    el.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{CT={id:b.dataset.start,vals:{},done:false,self:{},saved:false};renderCtrl();window.scrollTo(0,0)});return}
  const c=CONTROLES.find(x=>x.id===CT.id);const t=ctrlTotal(c);
  const g=CT.done?c.items.map((it,k)=>gradeItem(it,CT.vals[k])):[];
  const selfLeft=CT.done?c.items.filter((it,k)=>it.type==="self"&&CT.self[k]==null).length:0;
  const got=CT.done?c.items.reduce((a,it,k)=>a+(it.type==="self"?(CT.self[k]||0):g[k].pts),0):0;
  const field=(it,k)=>{const v=CT.vals[k];const ro=CT.done?"readonly":"";
    if(it.type==="grid")return `<div class="gridq${it.wide?" wide":""}">${it.rows.map((r,j)=>{const st=CT.done?(g[k].oks[j]?"ok":"ko"):"";return `<label class="${st}"><span>${esc(r.label)}</span><input id="g${k}_${j}" autocomplete="off" ${ro} value="${esc((v||[])[j]||"")}">${CT.done&&!g[k].oks[j]?`<span class="exp">${esc(r.alts[0])}</span>`:""}</label>`}).join("")}</div>`;
    if(it.type==="list"||it.type==="self")return `<textarea id="f${k}" class="ta" rows="${it.type==="self"?5:3}" ${ro} placeholder="${it.type==="list"?"Sépare par des virgules ou des barres /":"Ta réponse"}">${esc(v||"")}</textarea>`;
    return `<input id="f${k}" autocomplete="off" ${it.type==="num"?'inputmode="decimal"':""} ${ro} value="${esc(v||"")}" placeholder="Ta réponse">`};
  const corr=(it,k)=>{if(!CT.done)return "";
    if(it.type==="self"){const s=CT.self[k];return `<div class="corr"><span class="lbl">Corrigé</span><span class="model">${esc(it.model)}</span>${it.modelFig==="FMD"?FMD_SVG:""}
      <div class="row">${[[it.pts,"Tout bon"],[half(it.pts/2),"À moitié"],[0,"Faux"]].map(([pv,l])=>`<button class="btn small" data-self="${k}" data-v="${pv}" ${s===pv?'style="background:var(--ink);color:var(--bg)"':""}>${l} (${fmt(pv)})</button>`).join("")}</div></div>`}
    if(it.type==="list")return `<div class="corr"><span class="lbl">Corrigé</span><span>${esc(it.expect.map(a=>a[0]).join(" / "))}</span>${g[k].missing.length?`<span class="note">Manquant : ${esc(g[k].missing.join(", "))}</span>`:""}${it.ordered&&!g[k].order?`<span class="note">Pas dans le bon ordre, points divisés par 2.</span>`:""}</div>`;
    if(it.type==="grid")return "";
    return `<div class="corr"><span class="lbl">Corrigé</span><span>${esc(it.corr||it.answers&&it.answers[0]||"")}</span></div>`};
  el.innerHTML=`<div class="card stack ex">
    <div class="row" style="justify-content:space-between;align-items:baseline"><h2 style="font-size:30px">${esc(c.title)}</h2><span class="pts">/${t}</span></div>
    ${c.skipped?`<p class="note">${esc(c.skipped)}</p>`:""}
    ${CT.done?`<div class="stack" style="gap:6px"><span class="lbl">Ta note</span><div class="total">${fmt(got)}<small> / ${t}</small></div>${selfLeft?`<p class="note">Il te reste ${selfLeft} question${selfLeft>1?"s":""} à noter toi-même plus bas.</p>`:""}</div>`:""}
    <form id="exf" autocomplete="off">${c.items.map((it,k)=>`<div class="exq" id="q${k}">
      <div class="exh"><p>${k+1}. ${esc(it.q)}</p><span class="pts${CT.done?" got":""}">${CT.done?(it.type==="self"?(CT.self[k]==null?"à noter":fmt(CT.self[k])):fmt(g[k].pts))+" / ":"/"}${it.pts}</span></div>
      ${it.note?`<p class="note">${esc(it.note)}</p>`:""}${it.fig==="cible"?FIGS.cible:""}${field(it,k)}${corr(it,k)}</div>`).join("")}</form>
    <div class="row" style="justify-content:space-between">
      <button class="linkbtn" id="exback">${CT.done?"Retour aux contrôles":"Abandonner"}</button>
      ${CT.done?`<div class="row"><button class="btn" id="exredo">Refaire</button><button class="btn primary" id="exsave" ${selfLeft||CT.saved?"disabled":""}>${CT.saved?"Note enregistrée":"Enregistrer ma note"}</button></div>`:`<button class="btn primary" id="exsub">Rendre ma copie</button>`}
    </div></div>`;
  $("#exback").onclick=()=>{CT=null;renderCtrl();window.scrollTo(0,0)};
  const sub=$("#exsub");if(sub)sub.onclick=()=>{c.items.forEach((it,k)=>{if(it.type==="grid")CT.vals[k]=it.rows.map((_,j)=>$("#g"+k+"_"+j).value);else CT.vals[k]=$("#f"+k).value});CT.done=true;renderCtrl();window.scrollTo(0,0)};
  el.querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{const y=window.scrollY;CT.self[+b.dataset.self]=+b.dataset.v;renderCtrl();window.scrollTo(0,y)});
  const rd=$("#exredo");if(rd)rd.onclick=()=>{CT={id:CT.id,vals:{},done:false,self:{},saved:false};renderCtrl();window.scrollTo(0,0)};
  const sv=$("#exsave");if(sv)sv.onclick=()=>{const r=(stats.ctrl=stats.ctrl||{})[c.id]||{best:0};stats.ctrl[c.id]={last:got,best:Math.max(r.best||0,got),at:Date.now()};CT.saved=true;queueSave();renderCtrl()};
}
